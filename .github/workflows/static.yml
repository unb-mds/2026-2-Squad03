name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------
      # React (Vite)
      # ----------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React
        run: npm run build   # gera /dist

      # ----------------------
      # Python + MkDocs
      # ----------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
            python -m pip install --upgrade pip
        
            pip install \
              mkdocs \
              mkdocs-material \
              mkdocstrings \
              mkdocstrings-python
        
            pip install -r docs/productivity/requirements.txt

      - name: Build MkDocs dentro do React
        run: |
          mkdocs build --site-dir dist/docs

      # ----------------------
      # Deploy
      # ----------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4