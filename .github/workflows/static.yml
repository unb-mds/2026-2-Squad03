name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite o acionamento manual.
  workflow_run:
    workflows: ["executor langchaim"]
    types:
      - completed
    
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------
      # React (Vite)
      # ----------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React
        run: npm run build   # gera /dist

      # ----------------------
      # Python + MkDocs
      # ----------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
            python -m pip install --upgrade pip
        
            pip install \
              mkdocs \
              mkdocs-material \
              mkdocstrings \
              mkdocstrings-python
        
            pip install -r docs/productivity/requirements.txt
        
      - name: Coletor de métricas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Running collector..."
          python docs/productivity/collect_metrics.py
          echo "Collector finished. File stats:" 
          ls -lah docs/productivity/metrics.json || true
          echo "First bytes:" 
          (head -c 400 docs/productivity/metrics.json || true)

      - name: Commit updated metrics
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/productivity/metrics.json

          echo "Git status after add:" 
          git status --porcelain

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[bot] Métricas atualizadas" 
          echo "Committed. Pushing..."

          git push origin HEAD:${{ github.ref_name }}

      - name: Build MkDocs dentro do React
        run: |
          mkdocs build --site-dir dist/docs

      # ----------------------
      # Deploy
      # ----------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
