[pytest]
markers =
    integration: testes que batem em um banco Postgres/PostGIS real (Supabase de TESTE). Requer TEST_DATABASE_URL.

; Rodar so unitarios (rapido, sem rede, padrao recomendado para todo PR):
;   pytest -m "not integration"
;
; Rodar so integracao (precisa de TEST_DATABASE_URL exportada):
;   pytest -m integration tests/integration/
